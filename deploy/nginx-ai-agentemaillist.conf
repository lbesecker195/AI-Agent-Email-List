# nginx site for the mail API at ai.agentemaillist.com.
#
#   sudo cp deploy/nginx-ai-agentemaillist.conf /etc/nginx/sites-available/email-provider
#   sudo ln -s /etc/nginx/sites-available/email-provider /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Install this BEFORE running certbot. Certbot rewrites the file in place to add
# the TLS block and the port-80 redirect, so start with plain HTTP on 80.
#
# csuite_finder already has a site on this machine. This is a second server
# block alongside it, matched by server_name, so do NOT remove the other one.

upstream email_provider {
    server 127.0.0.1:4005;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.agentemaillist.com;

    # Certbot writes its challenge files here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://email_provider;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Required once FORCE_SSL=true is set. Without it the app believes every
        # request arrived in plaintext and redirects to HTTPS forever, which
        # looks like a broken application rather than a mis-proxied one.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Agents fetch this to learn how to use the API, and it needs no key. Cached
    # briefly because it is generated per request and its content only changes
    # when the service's own limits do.
    location = /llms.txt {
        proxy_pass http://email_provider;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=300";
    }

    # An inbound MIME document posted by an MTA is much larger than an API call.
    location /v1/inbound/ {
        proxy_pass http://email_provider;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 30m;
    }

    # Sends carry message bodies and attachments, so this is not the 1m an API
    # would otherwise want.
    client_max_body_size 30m;
}
